# Sveltia CMS config for Parenting Academy
# NOTE: replace `repo` with the real GitHub repo (owner/name) once created.
backend:
  name: github
  repo: OWNER/parenting-academy
  branch: main

site_url: https://example.pages.dev/
display_url: https://example.pages.dev/
logo_url: /favicon.ico

media_folder: static/images/uploads
public_folder: /images/uploads

# Posts use TOML front matter (+++), matching existing content files
collections:
  - name: posts
    label: Posts
    label_singular: Post
    folder: content/posts
    path: '{{slug}}'
    create: true
    format: toml-frontmatter
    extension: md
    slug: '{{slug}}'
    summary: '{{title}} — {{date}}'
    sortable_fields: ['date', 'title']
    view_filters:
      - { label: Drafts, field: draft, pattern: true }
      - { label: Published, field: draft, pattern: false }
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Publish date, name: date, widget: datetime, format: "2006-01-02T15:04:05+01:00" }
      - { label: Description, name: description, widget: text, hint: "Used for SEO meta description and post excerpts. Keep under 160 characters." }
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: Draft, name: draft, widget: boolean, default: true }
      - { label: Body, name: body, widget: markdown, hint: "Write like a real parent talking to a friend. No buzzwords, no exaggeration." }

  - name: pages
    label: Pages
    label_singular: Page
    files:
      - label: About
        name: about
        file: content/about.md
        format: toml-frontmatter
        extension: md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Body, name: body, widget: markdown }
      - label: Contact
        name: contact
        file: content/contact.md
        format: toml-frontmatter
        extension: md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Body, name: body, widget: markdown }
