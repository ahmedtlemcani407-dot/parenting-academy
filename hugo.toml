baseURL = 'https://parenting-academy.pages.dev/'
locale = 'en-us'
title = 'Parenting Academy'

enableRobotsTXT = true

# RSS / feeds
[outputs]
home = ['HTML', 'RSS']

# Taxonomies
[taxonomies]
category = 'categories'
