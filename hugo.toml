[params]
description = 'Practical parenting advice from a real parent — bedtime, screen time, picky eaters, discipline, and all the everyday stuff nobody warns you about.'
author = 'Parenting Academy'
# Used in meta keywords (keep short)
keywords = ['parenting', 'parenting advice', 'toddlers', 'kids', 'family']

