<style>
  :root {
    --bg: #fffdf8;
    --ink: #1c2a23;
    --muted: #55685e;
    --green: #0f8a4d;
    --line: #d5e7da;
    --butter: #ffd166;
    --blush: #ffab9e;
    --sky: #9fd8ef;
    --mint: #9fe6bb;
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --sans: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 18px;
    line-height: 1.65;
  }
  a { color: inherit; }
  a:focus-visible { outline: 3px solid var(--green); outline-offset: 3px; border-radius: 4px; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 24px; }

  header .wrap {
    display: flex; flex-wrap: wrap; gap: 12px 28px;
    justify-content: space-between; align-items: center;
    padding-top: 28px; padding-bottom: 28px;
  }
  .brand { font-family: var(--serif); font-weight: 700; font-size: 1.15rem; text-decoration: none; }
  nav { display: flex; gap: 22px; font-size: 0.95rem; align-items: center; }
  nav a { text-decoration: none; color: var(--muted); }
  nav a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }

  .theme-toggle {
    background: none; border: 1px solid var(--line); border-radius: 999px;
    width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--muted); padding: 0; flex: none;
  }
  .theme-toggle:hover { color: var(--ink); border-color: var(--green); }
  .theme-toggle svg { width: 18px; height: 18px; }
  .theme-toggle .icon-sun { display: none; }
  [data-theme="dark"] .theme-toggle .icon-sun { display: block; }
  [data-theme="dark"] .theme-toggle .icon-moon { display: none; }

  .hero { padding: 56px 0 40px; }
  h1 {
    font-family: var(--serif); font-weight: 700;
    font-size: clamp(2.2rem, 6.5vw, 3.4rem);
    line-height: 1.12; margin: 0 0 22px; letter-spacing: -0.01em;
  }
  .hero p { font-size: 1.15rem; color: var(--muted); max-width: 34em; margin: 0 0 14px; }
  .hero .sig { font-family: var(--serif); font-style: italic; color: var(--green); }

  .topics { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
  .topics span {
    font-size: 0.9rem; padding: 6px 14px; border-radius: 999px; background: var(--mint);
  }
  .topics span:nth-child(2) { background: var(--butter); }
  .topics span:nth-child(3) { background: var(--blush); }
  .topics span:nth-child(4) { background: var(--sky); }

  h2 { font-family: var(--serif); font-size: 1.5rem; margin: 56px 0 8px; }
  .posts { list-style: none; margin: 0; padding: 0; }
  .post { border-top: 1px solid var(--line); }
  .post:last-child { border-bottom: 1px solid var(--line); }
  .post a {
    display: flex; gap: 20px; align-items: center; text-decoration: none;
    padding: 26px 16px; margin: 0 -16px; border-radius: 14px;
  }
  .post a:hover { background: #fff; }
  .post time { font-size: 0.88rem; color: var(--muted); }
  .post h3 {
    font-family: var(--serif); font-weight: 700;
    font-size: 1.3rem; line-height: 1.3; margin: 4px 0 8px;
  }
  .post p { margin: 0; color: var(--muted); font-size: 1rem; }
  .post a:hover h3 { text-decoration: underline; text-decoration-color: var(--green); text-underline-offset: 5px; }
  .thumb { flex: none; width: 96px; height: 96px; border-radius: 18px; object-fit: cover; }
  @media (max-width: 520px) { .thumb { width: 72px; height: 72px; } .post a { gap: 14px; } }

  .note {
    margin: 64px 0 0; padding: 28px 30px; border-radius: 20px; background: var(--butter);
  }
  .note p { margin: 0 0 12px; }
  .note p:last-child { margin: 0; }
  .note a { color: var(--green); font-weight: 600; }

  footer { margin-top: 64px; padding: 32px 0 48px; font-size: 0.9rem; color: var(--muted); border-top: 1px solid var(--line); }
  footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px 24px; }
  footer nav { font-size: 0.9rem; }

  .banner { display: block; width: 100%; height: auto; margin-top: 36px; border-radius: 24px; }

  /* Article / page bodies */
  .article-head { padding: 48px 0 8px; }
  .article-head h1 { font-size: clamp(1.9rem, 5vw, 2.8rem); }
  .article-meta { color: var(--muted); font-size: 0.95rem; margin: 0 0 8px; }
  .article-body { font-size: 1.08rem; }
  .article-body > p:first-child { font-size: 1.15rem; }
  .article-body p, .article-body ul, .article-body ol { margin: 0 0 1.4em; }
  .article-body h2 { font-size: 1.45rem; margin: 2.2em 0 0.6em; }
  .article-body h3 { font-family: var(--serif); font-size: 1.2rem; margin: 1.8em 0 0.5em; }
  .article-body a { color: var(--green); font-weight: 600; }
  .article-body img { max-width: 100%; height: auto; border-radius: 16px; }
  .article-body blockquote {
    margin: 1.6em 0; padding: 4px 0 4px 22px;
    border-left: 4px solid var(--mint); color: var(--muted); font-style: italic;
  }
  .article-body blockquote p { margin: 0; }
  .article-body ul, .article-body ol { padding-left: 1.4em; }
  .article-body li { margin-bottom: 0.5em; }
  .article-body hr { border: none; border-top: 1px solid var(--line); margin: 2.5em 0; }

  /* Related posts */
  .related { margin: 64px 0 0; }
  .related h2 { margin-top: 0; }
  .related-grid { display: grid; gap: 12px; }
  .related-card {
    display: block; text-decoration: none; background: #fff;
    border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px;
  }
  .related-card:hover h3 { text-decoration: underline; text-decoration-color: var(--green); text-underline-offset: 4px; }
  .related-card h3 { font-family: var(--serif); font-size: 1.1rem; margin: 0 0 6px; line-height: 1.35; }
  .related-card p { margin: 0; color: var(--muted); font-size: 0.95rem; }
  .related-card time { font-size: 0.85rem; color: var(--muted); }

  .page-head { padding: 48px 0 8px; }

  .notfound { padding: 80px 0; text-align: center; }
  .notfound h1 { margin-bottom: 12px; }
  .notfound p { color: var(--muted); }

  [data-theme="dark"] {
    --bg: #0e1512;
    --ink: #eef4ef;
    --muted: #a3b8ac;
    --green: #63d99b;
    --line: #22332a;
  }
  [data-theme="dark"] .post a:hover { background: #16241c; }
  [data-theme="dark"] .topics span, [data-theme="dark"] .note { color: #17211b; }
  [data-theme="dark"] .related-card { background: #16241c; }

  /* Magazine homepage */
  body.home .wrap { max-width: 1120px; }
  :root { --card-bg: #ffffff; }
  [data-theme="dark"] { --card-bg: #15221b; }
  .ribbon { border-bottom: 1px solid var(--line); font-size: 0.72rem; color: var(--muted); padding: 7px 0; }
  .ribbon-wrap { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .lead-story { padding: 40px 0 48px; border-bottom: 1px solid var(--line); }
  .lead-grid { display: grid; grid-template-columns: 1.15fr 1fr; gap: 44px; align-items: center; }
  .lead-img-box { border-radius: 20px; overflow: hidden; aspect-ratio: 16 / 10; border: 1px solid var(--line); background: var(--card-bg); }
  .lead-img-box a { display: block; width: 100%; height: 100%; }
  .lead-img-box img, .card-img-box img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 0; }
  .meta-line { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 0.78rem; color: var(--muted); margin-bottom: 12px; }
  .meta-cat { font-weight: 700; color: var(--green); }
  .lead-title { margin: 0 0 14px; }
  .lead-excerpt { color: var(--muted); font-size: 1.02rem; margin: 0 0 22px; }
  .btn-read {
    display: inline-flex; align-items: center; gap: 8px; background: var(--ink); color: var(--bg);
    padding: 12px 24px; border-radius: 12px; font-size: 0.85rem; font-weight: 600;
    border: none; cursor: pointer; text-decoration: none;
  }
  .btn-read:hover { background: var(--green); color: #fff; }
  .credo-strip {
    padding: 40px 32px; background: var(--card-bg); border: 1px solid var(--line);
    border-radius: 20px; margin: 48px 0; text-align: center;
  }
  .credo-kicker { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 700; }
  .credo-strip h2 { margin: 8px 0; font-size: 1.85rem; }
  .credo-strip > p { color: var(--muted); max-width: 600px; margin: 0 auto; font-size: 0.95rem; }
  .credo-items { display: flex; justify-content: center; gap: 28px; margin-top: 16px; font-family: var(--serif); font-style: italic; color: var(--green); font-size: 0.95rem; flex-wrap: wrap; }
  .section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .section-head h2 { margin: 0; font-size: 1.75rem; }
  .section-head span { font-size: 0.85rem; color: var(--muted); }
  .magazine-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; margin-bottom: 64px; }
  .mag-card a { text-decoration: none; display: block; }
  .card-img-box { border-radius: 16px; overflow: hidden; aspect-ratio: 4 / 3; border: 1px solid var(--line); margin-bottom: 14px; background: var(--card-bg); }
  .card-img-box img { transition: transform 0.3s ease; }
  .mag-card:hover .card-img-box img { transform: scale(1.03); }
  .mag-card h3 { font-family: var(--serif); font-size: 1.3rem; line-height: 1.3; margin: 0 0 8px; }
  .mag-card:hover h3 { text-decoration: underline; text-decoration-color: var(--green); text-underline-offset: 4px; }
  .mag-card p { font-size: 0.95rem; color: var(--muted); line-height: 1.55; margin: 0; }
  .toolkit-box { background: var(--card-bg); border: 2px dashed var(--line); border-radius: 24px; padding: 36px; margin-bottom: 64px; }
  .toolkit-box-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
  .toolkit-kicker { font-size: 0.7rem; text-transform: uppercase; font-weight: 700; color: var(--green); letter-spacing: 0.08em; }
  .toolkit-box-head h2 { font-size: 1.65rem; margin: 4px 0; }
  .toolkit-box-head p { font-size: 0.88rem; color: var(--muted); margin: 0; }
  .toolkit-box-head p a { color: var(--green); font-weight: 600; }
  .chart-items { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .chart-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); cursor: pointer; user-select: none; font-size: 0.95rem; }
  .chart-item:hover { border-color: var(--green); }
  .chart-item.checked { background: #e8f7ee; border-color: var(--green); }
  [data-theme="dark"] .chart-item.checked { background: #14291d; }
  .chart-item.checked .chart-text { text-decoration: line-through; color: var(--muted); }
  .btn-print { background: var(--green); color: #fff; border: none; padding: 10px 18px; border-radius: 10px; font-weight: 600; font-size: 0.85rem; cursor: pointer; }
  .btn-print:hover { filter: brightness(1.08); }
  .chart-foot { margin-top: 24px; padding-top: 16px; border-top: 1px dashed var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 0.85rem; color: var(--muted); }
  @media (max-width: 860px) {
    .lead-grid { grid-template-columns: 1fr; gap: 28px; }
    .magazine-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 640px) { .chart-items { grid-template-columns: 1fr; } }
  @media print {
    header, .ribbon, .lead-story, .credo-strip, .magazine-grid, .section-head, footer, .btn-print, .btn-read, .toolkit-box-head p { display: none !important; }
    .toolkit-box { border: 2px solid #000; margin: 0; }
    .chart-item { break-inside: avoid; }
  }
</style>
