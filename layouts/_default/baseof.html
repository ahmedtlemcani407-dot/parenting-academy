<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default "en-us" }}">
<head>
{{ partial "head.html" . }}
<script>
/* Set night mode before first paint: saved choice wins, else system preference. */
(function(){try{var t=localStorage.getItem('pa-theme');if(t){document.documentElement.setAttribute('data-theme',t);}else if(window.matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}})();
</script>
</head>
<body>

<header>
  <div class="wrap">
    <a class="brand" href="{{ "/" | relURL }}">{{ site.Title }}</a>
    <nav aria-label="Main">
      {{- range site.Menus.main }}
      <a href="{{ .URL | relURL }}">{{ .Name }}</a>
      {{- end }}
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle night mode">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </nav>
  </div>
</header>

<main>
{{ block "main" . }}{{ end }}
</main>

<footer>
  <div class="wrap">
    <span>© {{ now.Format "2006" }} {{ site.Title }}</span>
    <nav aria-label="Footer">
      {{- range site.Menus.footer }}
      <a href="{{ .URL | relURL }}">{{ .Name }}</a>
      {{- end }}
    </nav>
  </div>
</footer>

<script>
/* Night mode toggle — choice persists across visits. */
(function(){
  var btn=document.getElementById('theme-toggle');if(!btn)return;
  function setMeta(dark){var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',dark?'#0e1512':'#fffdf8');}
  btn.addEventListener('click',function(){
    var dark=document.documentElement.getAttribute('data-theme')==='dark';
    document.documentElement.setAttribute('data-theme',dark?'light':'dark');
    try{localStorage.setItem('pa-theme',dark?'light':'dark');}catch(e){}
    setMeta(!dark);
  });
  setMeta(document.documentElement.getAttribute('data-theme')==='dark');
})();
</script>

</body>
</html>
